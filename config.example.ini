# Copy this file to config.ini and fill in the values.
# Environment variables with the same names override these values.
[eqinv]

# MariaDB connection
EQINV_DB_HOST = 127.0.0.1
EQINV_DB_PORT = 3306
EQINV_DB_NAME = eqinv
EQINV_DB_USER = eqinv
EQINV_DB_PASSWORD =

# Generate a persistent random secret of at least 32 characters.
EQINV_SECRET_KEY =

# Discord application, server, and required role.
EQINV_DISCORD_CLIENT_ID =
EQINV_DISCORD_CLIENT_SECRET =
EQINV_DISCORD_REDIRECT_URI = http://127.0.0.1:5000/auth/discord/callback
EQINV_DISCORD_GUILD_ID =
EQINV_DISCORD_ROLE_ID =
EQINV_DISCORD_BOT_TOKEN =
